<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Вход</title>
    <th:block th:replace="~{fragments :: styles}"></th:block>
</head>
<body>
<nav th:replace="~{fragments :: menu('login')}"></nav>
<div class="container" style="max-width: 440px">
    <div th:if="${param.error}" class="alert alert-danger">Неверный логин или пароль</div>
    <div th:if="${param.logout}" class="alert alert-success">Вы вышли из системы</div>
    <div th:if="${param.registered}" class="alert alert-success">Регистрация прошла успешно, войдите в систему</div>

    <div class="card">
        <div class="card-header"><h4 class="mb-0 text-center">Вход</h4></div>
        <div class="card-body">
            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label" for="username">Логин</label>
                    <input type="text" id="username" name="username" class="form-control" required autofocus/>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Пароль</label>
                    <input type="password" id="password" name="password" class="form-control" required/>
                </div>
                <button type="submit" class="btn btn-success w-100">Войти</button>
            </form>
            <p class="mt-3 mb-0 text-center">Нет учётной записи? <a th:href="@{/register}">Зарегистрироваться</a></p>
        </div>
    </div>
</div>
</body>
</html>
