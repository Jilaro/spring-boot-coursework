<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Магазин</title>
    <th:block th:replace="~{fragments :: styles}"></th:block>
</head>
<body>
<nav th:replace="~{fragments :: menu('shops')}"></nav>
<div class="container" style="max-width: 560px">
    <h3 th:text="${form.id == null} ? 'Новый магазин' : 'Изменение магазина'">Магазин</h3>
    <hr/>
    <form th:action="@{/shops/save}" th:object="${form}" method="post" novalidate>
        <input type="hidden" th:field="*{id}"/>
        <div class="mb-3">
            <label class="form-label" for="name">Название</label>
            <input type="text" th:field="*{name}" class="form-control" th:errorclass="is-invalid"/>
            <div class="invalid-feedback" th:errors="*{name}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="city">Город</label>
            <input type="text" th:field="*{city}" class="form-control" th:errorclass="is-invalid"/>
            <div class="invalid-feedback" th:errors="*{city}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="address">Адрес (улица, дом)</label>
            <input type="text" th:field="*{address}" class="form-control" th:errorclass="is-invalid"/>
            <div class="invalid-feedback" th:errors="*{address}"></div>
        </div>
        <button type="submit" class="btn btn-success">Сохранить</button>
        <a th:href="@{/shops}" class="btn btn-outline-secondary ms-2">К списку</a>
    </form>
</div>
</body>
</html>
