<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Журнал действий</title>
    <th:block th:replace="~{fragments :: styles}"></th:block>
</head>
<body>
<nav th:replace="~{fragments :: menu('actions')}"></nav>
<div class="container">
    <h3>Журнал действий пользователей</h3>
    <hr/>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <span class="text-muted">Записи из таблицы USER_ACTIONS, новые сверху</span>
        <a th:href="@{/actuator/logfile}" target="_blank" class="btn btn-outline-success btn-sm">Открыть лог-файл</a>
    </div>

    <table id="actions" class="table table-striped table-bordered align-middle">
        <thead>
        <tr>
            <th>Дата и время</th>
            <th>Пользователь</th>
            <th>Уровень</th>
            <th>Действие</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="a : ${actions}">
            <!-- data-order: сортировка по дате, а не по тексту -->
            <td th:attr="data-order=${a.dateActions}"
                th:text="${#temporals.format(a.dateActions, 'dd.MM.yyyy HH:mm:ss')}"></td>
            <td th:text="${a.username}"></td>
            <td>
                <span class="badge" th:classappend="${a.level == 'WARN'} ? 'bg-warning text-dark' : 'bg-secondary'"
                      th:text="${a.level}"></span>
            </td>
            <td th:text="${a.description}"></td>
        </tr>
        </tbody>
    </table>
</div>
<th:block th:replace="~{fragments :: table-scripts('actions')}"></th:block>
</body>
</html>
