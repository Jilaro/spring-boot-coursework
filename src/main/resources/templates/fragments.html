<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>

<th:block th:fragment="styles">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css">
</th:block>

<!-- Меню: пункты зависят от того, вошёл ли пользователь и какая у него роль -->
<nav th:fragment="menu(active)" class="navbar navbar-expand-lg navbar-dark bg-success mb-4">
    <div class="container">
        <a class="navbar-brand fw-semibold" th:href="@{/}">Учёт покупок</a>
        <div class="navbar-nav me-auto">
            <th:block th:if="${currentUser}">
                <a class="nav-link" th:classappend="${active == 'products'} ? 'active'" th:href="@{/products}">Покупки</a>
                <a class="nav-link" th:classappend="${active == 'shops'} ? 'active'" th:href="@{/shops}">Магазины</a>
                <a class="nav-link" th:classappend="${active == 'calculate'} ? 'active'" th:href="@{/calculate}">Расчёт расходов</a>
            </th:block>
            <th:block th:if="${isAdmin}">
                <a class="nav-link" th:classappend="${active == 'admin'} ? 'active'" th:href="@{/admin/users}">Роли пользователей</a>
                <a class="nav-link" th:href="@{/actuator/health}" target="_blank">Мониторинг</a>
            </th:block>
            <a class="nav-link" th:classappend="${active == 'about'} ? 'active'" th:href="@{/about}">О приложении</a>
        </div>
        <div class="navbar-nav align-items-center">
            <th:block th:unless="${currentUser}">
                <a class="nav-link" th:href="@{/login}">Вход</a>
                <a class="nav-link" th:href="@{/register}">Регистрация</a>
            </th:block>
            <th:block th:if="${currentUser}">
                <span class="navbar-text me-3">
                    <span th:text="${currentUser}"></span>
                    <span class="badge bg-light text-success ms-1" th:text="${roleTitle}"></span>
                </span>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-outline-light btn-sm">Выйти</button>
                </form>
            </th:block>
        </div>
    </div>
</nav>

<!-- Сообщения после сохранения и удаления (flash-атрибуты) -->
<th:block th:fragment="messages">
    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
</th:block>

<th:block th:fragment="table-scripts(tableId)">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>
    <script th:inline="javascript">
        $(function () {
            $('#' + /*[[${tableId}]]*/ 'table').DataTable({
                language: {url: 'https://cdn.datatables.net/plug-ins/1.13.8/i18n/ru.json'},
                order: [],
                columnDefs: [{orderable: false, targets: 'no-sort'}]
            });
        });
    </script>
</th:block>

</body>
</html>
