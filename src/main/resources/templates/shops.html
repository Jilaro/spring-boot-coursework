<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Магазины</title>
    <th:block th:replace="~{fragments :: styles}"></th:block>
</head>
<body>
<nav th:replace="~{fragments :: menu('shops')}"></nav>
<div class="container">
    <h3>Список магазинов</h3>
    <hr/>
    <th:block th:replace="~{fragments :: messages}"></th:block>
    <a th:if="${canEdit}" th:href="@{/shops/new}" class="btn btn-success mb-3">Добавить магазин</a>

    <table class="table table-bordered table-striped align-middle" id="shopTable">
        <thead>
        <tr>
            <th>Название</th>
            <th>Город</th>
            <th>Адрес</th>
            <th th:if="${isAdmin}">Добавил</th>
            <th th:if="${canEdit}" class="no-sort">Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="s : ${shops}">
            <td th:text="${s.name}"></td>
            <td th:text="${s.city}"></td>
            <td th:text="${s.address}"></td>
            <td th:if="${isAdmin}" th:text="${s.owner.username}"></td>
            <td th:if="${canEdit}" class="text-nowrap">
                <th:block th:if="${editableIds.contains(s.id)}">
                    <a th:href="@{/shops/edit(id=${s.id})}" class="btn btn-info btn-sm">Изменить</a>
                    <form th:action="@{/shops/delete}" method="post" class="d-inline"
                          onsubmit="return confirm('Удалить магазин?')">
                        <input type="hidden" name="id" th:value="${s.id}"/>
                        <button type="submit" class="btn btn-danger btn-sm ms-1">Удалить</button>
                    </form>
                </th:block>
            </td>
        </tr>
        </tbody>
    </table>
</div>
<th:block th:replace="~{fragments :: table-scripts('shopTable')}"></th:block>
</body>
</html>
