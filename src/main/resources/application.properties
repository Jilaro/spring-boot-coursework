spring.application.name=shopping-list
server.port=8080

# База данных H2 в файле testdb/shopping в папке проекта
spring.datasource.url=jdbc:h2:file:./testdb/shopping;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# Таблицы создаёт Hibernate по классам @Entity и дополняет при изменении классов
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.thymeleaf.cache=false

# Логи пишутся в консоль и в отдельный файл logs/shopping.log
logging.file.name=logs/shopping.log
logging.level.root=INFO
logging.level.ru.urabov.shopping=INFO
logging.logback.rollingpolicy.max-file-size=5MB
logging.logback.rollingpolicy.max-history=7

# Учётная запись администратора, создаётся при первом запуске
app.admin.username=admin
app.admin.password=admin123

# Actuator: открытые эндпоинты; все, кроме health, доступны только ADMIN
management.endpoints.web.exposure.include=health,info,metrics,loggers,logfile,mappings
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
management.info.java.enabled=true
management.info.os.enabled=true
